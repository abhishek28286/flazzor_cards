<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

            background-color: #0b0f19;

            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            position: relative;
            width: 100%;
            max-width: 650px;
        }
        .card-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        /* क्लिक करने योग्य हॉटस्पॉट क्षेत्र (Transparent Hotspots) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 0, 0, 0.0); /* टेस्टिंग के लिए इसे 0.2 कर सकते हैं ताकि एरिया दिखे */
        }
        .hotspot:hover {
            background: rgba(56, 189, 248, 0.2);
            border: 1px dashed #38bdf8;
        }

        /* आपके विजिटिंग कार्ड के अनुसार लिंक्स की सटीक पोजीशन (प्रतिशत में) */
        .phone-1 { top: 2%; right: 4%; width: 26%; height: 6%; }     /* 98280 28286[span_0](start_span)[span_0](end_span) */
        .phone-2 { top: 8%; right: 4%; width: 26%; height: 6%; }     /* 74250 61880[span_1](start_span)[span_1](end_span) */
        .email-link { bottom: 12%; right: 10%; width: 35%; height: 5%; } /* abhishek28286@gmail.com[span_2](start_span)[span_2](end_span) */
        .web-link { bottom: 5%; right: 10%; width: 30%; height: 5%; }   /* www.flazzor.in[span_3](start_span)[span_3](end_span) */
        
        /* अगर आप बीच के खाली हिस्से या किसी और जगह पर भी WhatsApp क्लिक लगाना चाहें */
        .whatsapp-float { bottom: 35%; left: 10%; width: 35%; height: 25%; } 
    </style>
</head>
<body>

<div class="card-container">
    <!-- यहाँ आपकी असली JPG इमेज लोड होगी (अगर फाइल का नाम अलग है तो यहाँ बदल लें) -->
