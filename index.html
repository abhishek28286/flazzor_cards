<head>

    <title>Flazzor Interiors - Digital Visiting Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .card-container {
            position: relative;
            width: 100%;
            max-width: 700px;
        }
        .card-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        /* हॉटस्पॉट स्टाइल्स (क्लिकेबल एरिया) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.0); /* टेस्टिंग के लिए हल्का रंग देख सकते हैं */
        }

        /* ऊपर दिए गए फोन नंबर */
        .phone-1 { top: 22px; right: 25px; width: 35%; height: 6%; }     
        .phone-2 { top: 70px; right: 25px; width: 35%; height: 6%; }     

        /* नीचे दिए गए चार बटन (Website, Email, WhatsApp, Facebook) */
        .btn-website   { bottom: 2%; left: 3%; width: 22%; height: 10%; }
        .btn-email     { bottom: 2%; left: 27%; width: 22%; height: 10%; }
        .btn-whatsapp  { bottom: 2%; left: 51%; width: 22%; height: 10%; }
        .btn-facebook  { bottom: 2%; left: 75%; width: 22%; height: 10%; }

        /* बड़ा 'Save Contact' बटन */
        .save-contact-btn {
            display: block;
            width: 90%;
            max-width: 350px;
            margin: 20px auto;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5);
            transition: 0.3s;
        }
        .save-contact-btn:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
        }
    </style>
</head>
