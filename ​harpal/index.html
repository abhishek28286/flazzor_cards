<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style & Creation - Digital Visiting Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .card-container {
            position: relative;
            width: 100%;
            max-width: 750px;
        }
        .card-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.0); /* जरूरत पड़ने पर टेस्टिंग के लिए रंग देख सकते हैं */
        }

        /* कार्ड के दाईं तरफ ऊपर दिया गया फोन नंबर (डायरेक्ट कॉल के लिए) */
        .call-top { bottom: 23%; right: 5%; width: 42%; height: 7%; }

        /* सबसे नीचे वाली काली पट्टी के तीन लिंक्स (WhatsApp, Email, Call) */
        .bottom-whatsapp { bottom: 2%; left: 3%; width: 30%; height: 9%; }
        .bottom-email    { bottom: 2%; left: 35%; width: 33%; height: 9%; }
        .bottom-call     { bottom: 2%; left: 70%; width: 27%; height: 9%; }

        /* बड़ा 'Save Contact' बटन */
        .save-contact-btn {
            display: block;
            width: 90%;
            max-width: 350px;
            margin: 20px auto;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5);
            transition: 0.3s;
        }
        .save-contact-btn:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- हर्पल जी की कार्ड इमेज (GitHub पर इसका नाम card.jpg रखें) -->

    <!-- 1. ऊपर दिए गए फोन नंबर पर क्लिक करने से डायरेक्ट कॉल -->

    <a href="mailto:harpalsingh609@gmail.com" class="hotspot bottom-email" title="Email"></a>
    <a href="tel:7568746833" class="hotspot bottom-call" title="Call"></a>
</div>
